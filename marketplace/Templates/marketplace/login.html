{% extends 'marketplace/base.html' %}
{% load crispy_forms_tags %} 

{% block title %}Login - Eco-Cycle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow border-0 mt-5">
            <div class="card-body p-5">
                <h3 class="card-title text-success fw-bold text-center mb-4">Welcome Back</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success btn-lg shadow-sm">Log In</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <p class="text-muted small">Don't have an account? <a href="{% url 'register' %}" class="text-success text-decoration-none">Register here</a>.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
