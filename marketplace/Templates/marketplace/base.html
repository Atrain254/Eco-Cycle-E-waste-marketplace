<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eco-Cycle{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'item_list' %}">♻️ Eco-Cycle</a>
            
            <div class="collapse navbar-collapse d-flex justify-content-end">
                <ul class="navbar-nav align-items-center">
                    
                    {% if user.is_authenticated %}
                        <li class="nav-item me-3">
                            <span class="nav-link text-light">Hello, <strong>{{ user.username }}</strong>!</span>
                        </li>
                        
                        <li class="nav-item me-3">
                            <a class="nav-link text-white fw-bold text-decoration-underline" href="{% url 'dashboard' %}">My Dashboard</a>
                        </li>
                        
                        <li class="nav-item me-3">
                            <a class="nav-link text-success fw-bold bg-white rounded px-3" href="{% url 'add_item' %}">+ List an Item</a>
                        </li>
                        
                        <li class="nav-item">
                            <form method="POST" action="{% url 'logout' %}" class="m-0">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light btn-sm">Log Out</button>
                            </form>
                        </li>
                        
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'login' %}">Log In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-success fw-bold bg-white rounded px-3 ms-2" href="{% url 'register' %}">Register</a>
                        </li>
                    {% endif %}
                    
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
