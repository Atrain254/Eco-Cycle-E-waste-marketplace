{% extends 'marketplace/base.html' %}
{% load crispy_forms_tags %} 

{% block title %}Register - Eco-Cycle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 mt-5">
            <div class="card-body p-5">
                <h3 class="card-title text-success fw-bold text-center mb-4">Join Eco-Cycle</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success btn-lg shadow-sm">Create Account</button>
                    </div>
                </form>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
